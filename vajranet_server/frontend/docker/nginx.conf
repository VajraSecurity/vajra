# SPA fallback for the built frontend -- same shape as the repo's own
# deploy/nginx/nginx-https.conf.example (which serves this build in production behind a
# reverse proxy at /); this one just serves it standalone on :80 for the
# container image, no /api or /grafana proxying included.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;

    # Agent packages (the agents service fills this folder). A missing file is a real 404 instead of
    # the console page, and the browser is told to save the file.
    location /downloads/ {
        try_files $uri =404;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff";
    }

    location / {
        try_files $uri /index.html;
    }
}
