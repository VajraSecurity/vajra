[server]
root_url = https://localhost/grafana/
serve_from_sub_path = true
http_addr = 127.0.0.1
http_port = 3000

[database]
type = sqlite3

[auth.proxy]
enabled = true
header_name = X-WEBAUTH-USER
header_property = email
auto_sign_up = true
headers = Name:X-WEBAUTH-USER-NAME Role:X-WEBAUTH-ROLE

[auth]
disable_login_form = true

# Every request must go through nginx's auth_request gate and carry a real
# X-WEBAUTH-* identity from validateGrafana.ts — no unauthenticated path into
# a Grafana session that has direct SQL/Explore access to grafana_reader's
# datasources. Previously force-enabled with Editor role via a systemd env
# override in the old setup_grafana_all.sh; that override is gone (see
# grafana/setup.sh) so this explicit [auth.anonymous] block is now the one
# place that decides this, instead of an untracked env var on the host.
[auth.anonymous]
enabled = false

[security]
allow_embedding = true
cookie_samesite = lax

[users]
auto_assign_org = true
auto_assign_org_role = Viewer

[log]
mode = console
level = info
