# Vajra: the whole platform on one machine.
#
#   ./docker/init-env.sh            # creates .env with random secrets
#   docker compose up -d --build    # builds and starts everything
#
# Then open http://localhost:8080. See README.md for the first login and for connecting agents.
#
# Services
#   postgres      PostgreSQL with two databases: fleet (C++ server) and vajra_db (web console)
#   redis         cache used by the web backend
#   kafka         message broker between the C++ server and the detection engine
#   vajra-server  C++ server: agents enroll and send telemetry here (port 1234)
#   vajra-engine  detection and correlation engine (reads Kafka, writes alerts)
#   backend       Node.js API and agent WebSocket (port 4000)
#   frontend      web console (port 8080)
#   agents        builds linux_agent.zip and windows_agent.zip for PUBLIC_HOST; served by the
#                 web console at http://PUBLIC_HOST:8080/downloads/ and linked in its sidebar
# One-shot helpers: kafka-init (topics), db-init (fleet schema), fleet-setup (nodes columns and tables
# the web console needs), db-extras (extra fleet SQL), agents.
# Start order: postgres/redis/kafka, db-init, backend, db-extras, then vajra-server and vajra-engine.
#
# This is a local, plain-HTTP setup. For production put TLS and your own domain in front.

name: vajra

services:
  postgres:
    # postgres:16 plus the TimescaleDB extension (see docker/postgres-timescale/Dockerfile).
    build:
      context: ./docker/postgres-timescale
    image: vajra/postgres-timescale:local
    environment:
      POSTGRES_USER: vajra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?run ./docker/init-env.sh or set DB_PASSWORD in .env}
      POSTGRES_DB: fleet
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sh:/docker-entrypoint-initdb.d/10-vajra-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vajra -d fleet && psql -U vajra -d vajra_db -tAc 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    environment:
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 30
    restart: unless-stopped

  # Creates the topics the C++ server publishes to and the engine reads, plus their dead-letter topics.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        for t in vajra_windows_events vajra_linux_events vajra_macos_events; do
          for name in "$$t" "$$t.dlq"; do
            /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
              --topic "$$name" --partitions 3 --replication-factor 1
          done
        done
        echo "kafka-init: topics ready"
    restart: "no"

  # Applies the fleet database schema and the numbered migrations. Safe to re-run.
  db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vajra
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: fleet
    volumes:
      - ./vajra_server/sql:/sql:ro
      - ./vajra_server/engine_v2/schema:/engine_v2_schema:ro
      - ./vajra_server/scripts/migrate.sh:/migrate.sh:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=0 -q -f /sql/schema.sql
        psql -v ON_ERROR_STOP=0 -q -f /engine_v2_schema/incidents.sql
        for f in /sql/0[0-9]_*.sql; do
          [ -e "$$f" ] || continue
          # Once the event tables are hypertables, 02's CREATE INDEX CONCURRENTLY is rejected
          # (the indexes already exist from the first run), so skip it instead of logging errors.
          if [ "$$(basename "$$f")" = 02_production_indexes.sql ] && \
             [ "$$(psql -Atc "SELECT count(*) FROM pg_extension WHERE extname='timescaledb'")" = 1 ] && \
             [ "$$(psql -Atc "SELECT count(*) FROM timescaledb_information.hypertables")" != 0 ]; then
            echo "db-init: skipping $$f (event tables are hypertables, indexes already exist)"
            continue
          fi
          psql -v ON_ERROR_STOP=0 -q -f "$$f"
        done
        bash /migrate.sh
        echo "db-init: schema and migrations applied"
    restart: "no"

  vajra-server:
    build:
      context: ./vajra_server
      dockerfile: docker/Dockerfile
    image: vajra/server:local
    # Starts last on purpose: the C++ server prepares its SQL statements when it starts, and the
    # backend and db-extras change the same tables on their first run. A server that started
    # earlier would answer enrollment requests with "cached plan must not change result type".
    depends_on:
      db-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      db-extras:
        condition: service_completed_successfully
      db-timescale:
        condition: service_completed_successfully
    environment:
      VAJRA_SERVICE: server
      SERVER_HOSTNAME: ${PUBLIC_HOST:-localhost}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: vajra
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: fleet
      KAFKA_BOOTSTRAP: kafka:9092
      SSL_PASSWORD: ${SSL_PASSWORD:?set SSL_PASSWORD in .env}
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:?set ENROLLMENT_SECRET in .env}
    volumes:
      - vajra-ssl:/app/ssl
    ports:
      - "${FLEET_PORT:-1234}:1234"
    restart: unless-stopped

  vajra-engine:
    # Same image as vajra-server, which builds it; never try to pull it from a registry.
    image: vajra/server:local
    pull_policy: never
    depends_on:
      vajra-server:
        condition: service_started
    environment:
      VAJRA_SERVICE: engine
      SERVER_HOSTNAME: ${PUBLIC_HOST:-localhost}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: vajra
      DB_PASS: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      DB_NAME: fleet
      KAFKA_BOOTSTRAP: kafka:9092
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:?set ENROLLMENT_SECRET in .env}
    restart: unless-stopped

  backend:
    build:
      context: ./vajranet_server
      dockerfile: backend/Dockerfile
    image: vajra/backend:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment: &backend-env
      # Development mode: plain HTTP, and the backend creates its own tables on first start.
      NODE_ENV: development
      PORT: "4000"
      PG_HOST: postgres
      PG_PORT: "5432"
      POSTGRES_USER: vajra
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB: vajra_db
      PG_HOST1: postgres
      PG_PORT1: "5432"
      POSTGRES_USER1: vajra
      POSTGRES_PASSWORD1: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      POSTGRES_DB1: fleet
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      ACCESS_JWT_SECRET: ${ACCESS_JWT_SECRET:?set ACCESS_JWT_SECRET in .env}
      REFRESH_JWT_SECRET: ${REFRESH_JWT_SECRET:?set REFRESH_JWT_SECRET in .env}
      ACCESS_JWT_EXPIRATION: 120m
      REFRESH_JWT_EXPIRATION: 7d
      CSRF_TOKEN_STRATEGY: UUID
      CSRF_COOKIE_NAME: XSRF-TOKEN
      CSRF_HEADER_NAME: X-XSRF-TOKEN
      ACCESS_TOKEN_MAX_AGE_MS: "7200000"
      REFRESH_TOKEN_MAX_AGE_MS: "604800000"
      # Must equal the address the browser uses for the web console.
      FRONTEND_URL: http://${PUBLIC_HOST:-localhost}:${WEB_PORT:-8080}
      BACKEND_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-4000}
      HOST_IP: ${PUBLIC_HOST:-localhost}
      LOGIN_MAX_FAILED_ATTEMPTS: "5"
      LOGIN_CAPTCHA_EXPIRY_MS: "300000"
      MAX_USER_COUNT: "1000"
      ON_PREM: "true"
      NESSUS_ENCRYPTION_KEY: ${NESSUS_ENCRYPTION_KEY:?set NESSUS_ENCRYPTION_KEY in .env}
      AGENT_MTLS_MODE: "off"
      WS_ENABLED: "false"
    volumes:
      - backend-keys:/app/keys
      - backend-storage:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    ports:
      - "${API_PORT:-4000}:4000"
    restart: unless-stopped

  # Fleet database setup the backend's own start does not do in development mode: the nodes group
  # columns (group_ids, owner_group_id) and the tables the device pages need. Without it the
  # Devices page fails with HTTP 500. Safe to re-run.
  fleet-setup:
    image: vajra/backend:local
    pull_policy: never
    depends_on:
      backend:
        condition: service_healthy
    environment: *backend-env
    command: ["sh", "-c", "node dist/orm/config/ormconfig-setup.js --fleet || echo 'WARNING: fleet-setup failed, see the lines above'"]
    restart: "no"

  # Extra columns, indexes and the live-alerts trigger for the fleet database. Runs once the
  # backend is healthy (its first start creates the tables these files touch). Safe to re-run.
  db-extras:
    image: postgres:16
    depends_on:
      fleet-setup:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vajra
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: fleet
    volumes:
      - ./vajranet_server/backend:/backend:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - bash /backend/migrations/apply-fleet-extras.sh /backend
    restart: "no"

  # Converts the high-volume event tables to TimescaleDB hypertables (compression after 3 days).
  # Runs after every other step that creates indexes on those tables, because hypertables reject
  # CREATE INDEX CONCURRENTLY. Safe to re-run; skips itself if the extension is unavailable.
  db-timescale:
    image: postgres:16
    depends_on:
      db-extras:
        condition: service_completed_successfully
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: vajra
      PGPASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      PGDATABASE: fleet
    volumes:
      - ./vajra_server/sql/timescaledb:/sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - psql -v ON_ERROR_STOP=0 -q -f /sql/hypertables.sql
    restart: "no"

  # Packages the agents with this host's address, the CA certificate the C++ server created and
  # the enrollment secret. Waits for the certificate, so it needs vajra-server running.
  agents:
    image: alpine:3.20
    depends_on:
      vajra-server:
        condition: service_started
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-localhost}
      ENROLLMENT_SECRET: ${ENROLLMENT_SECRET:?set ENROLLMENT_SECRET in .env}
      FLEET_PORT: ${FLEET_PORT:-1234}
      API_PORT: ${API_PORT:-4000}
      OSQUERY_VERSION: ${OSQUERY_VERSION:-5.12.1}
      EXTENSION_URL: ${EXTENSION_URL:-}
      EXTENSION_SHA256: ${EXTENSION_SHA256:-}
      CERT: /ssl/myCA.pem
      OUT_DIR: /out
      LINUX_AGENT_DIR: /src/linux_agent
      WINDOWS_AGENT_DIR: /src/windows_agent
    volumes:
      - vajra-ssl:/ssl:ro
      - ./linux_agent:/src/linux_agent:ro
      - ./windows_agent:/src/windows_agent:ro
      - ./scripts/package-agents.sh:/package-agents.sh:ro
      - agent-downloads:/out
    entrypoint: ["/bin/sh", "-c"]
    command:
      - apk add --no-cache -q bash zip curl tar findutils coreutils >/dev/null && bash /package-agents.sh
    restart: "no"

  frontend:
    build:
      context: ./vajranet_server
      dockerfile: frontend/Dockerfile
      args:
        # The browser calls the backend directly at this address.
        VITE_API_BASE_URL: http://${PUBLIC_HOST:-localhost}:${API_PORT:-4000}
        VITE_DEPLOYMENT_MODE: on_prem
        # Agent downloads, served by this same web server from the agent-downloads volume below. Relative on
        # purpose: the link inherits the scheme, host and port of the page, so it is never mixed content
        # and still works when the console is opened by another name or port.
        VITE_WINDOWS_AGENT_INSTALLER_URL: /downloads/windows_agent.zip
        VITE_LINUX_AGENT_INSTALLER_URL: /downloads/linux_agent.zip
    image: vajra/frontend:local
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      - agent-downloads:/usr/share/nginx/html/downloads:ro
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  pgdata:
  kafka-data:
  vajra-ssl:
  backend-keys:
  backend-storage:
  agent-downloads:
