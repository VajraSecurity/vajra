<svg xmlns="http://www.w3.org/2000/svg" width="600" height="48" viewBox="0 0 600 48">
<style>
text{font:500 20px Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Helvetica,Arial,sans-serif;fill:#64748b;letter-spacing:.3px}
.v{font-weight:700;fill:#8f407f}
.w{opacity:0;animation:cycle 12s infinite}
.bar{fill:#8f407f;transform-origin:300px 44px;animation:sweep 3s ease-in-out infinite}
@keyframes cycle{0%{opacity:0;transform:translateY(8px)}3.00%{opacity:1;transform:none}21.25%{opacity:1;transform:none}25.00%,100%{opacity:0;transform:translateY(-8px)}}
@keyframes sweep{0%{transform:scaleX(0);opacity:0}20%{opacity:1}50%{transform:scaleX(1);opacity:1}85%{opacity:.0}100%{transform:scaleX(1);opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
@media (prefers-reduced-motion: reduce){.w:first-child{opacity:1}}
</style>
<g class="w" style="animation-delay:0s"><text x="300" y="30" text-anchor="middle"><tspan class="v">Detect</tspan> threats across every endpoint</text></g><g class="w" style="animation-delay:3s"><text x="300" y="30" text-anchor="middle"><tspan class="v">Prove</tspan> compliance with audit-ready reports</text></g><g class="w" style="animation-delay:6s"><text x="300" y="30" text-anchor="middle"><tspan class="v">Patch</tspan> vulnerabilities before they are exploited</text></g><g class="w" style="animation-delay:9s"><text x="300" y="30" text-anchor="middle"><tspan class="v">Control</tspan> USB, Bluetooth, ports and IPs</text></g>
<rect class="bar" x="240" y="43" width="120" height="3" rx="1.5"/>
</svg>
